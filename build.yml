name: Build OZ Fabric 1.20.1

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle clean build --stacktrace

      - name: Upload remapped mod jar
        uses: actions/upload-artifact@v4
        with:
          name: oz-origins-zaruba-1.20.1
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
