name: Build OZ Fabric 1.20.1

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract OZ sources
        run: unzip -o OZ_SRC_PAYLOAD.zip -d .

      - name: Build Fabric mod
        run: gradle build --stacktrace

      - name: Prepare JAR
        if: success()
        run: |
          mkdir -p artifact
          find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -exec cp {} artifact/ \;

      - name: Upload OZ JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OZ-Mod-1.20.1
          path: artifact/*.jar
        
